name: Build Android APK

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      release:
        description: Publish the APK as a GitHub release
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build preview APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Build APK with EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build --platform android --profile preview --non-interactive --wait --json > eas-build.json
          node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync('eas-build.json','utf8')); const build=Array.isArray(data)?data[0]:data; const url=build?.artifacts?.buildUrl; if(!url) throw new Error('No buildUrl in EAS output: '+JSON.stringify(build).slice(0,500)); fs.writeFileSync('apk-url', url);"

      - name: Download APK
        run: curl -fL --retry 3 -o FoundList-preview.apk "$(cat apk-url)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FoundList-preview-apk
          path: FoundList-preview.apk
          if-no-files-found: error

      - name: Create GitHub release
        if: github.event_name == 'workflow_dispatch' && inputs.release == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./app.json').expo.version")
          tag="v${version}-build.${GITHUB_RUN_NUMBER}"
          previous=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$previous" ]; then changes=$(git log "$previous..HEAD" --pretty=format:'- %s' --no-merges); else changes=$(git log -12 --pretty=format:'- %s' --no-merges); fi
          {
            printf '## FoundList %s\n\nA calmer, clearer todo list for remembering what matters.\n\n### Changelog\n' "$tag"
            printf '%s\n' "$changes"
            printf '\n### Install\nDownload FoundList-preview.apk and install it on Android 10 or newer.\n'
          } > release-notes.md
          gh release create "$tag" FoundList-preview.apk --repo "$GITHUB_REPOSITORY" --title "FoundList $tag" --notes-file release-notes.md